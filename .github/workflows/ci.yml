name: CI

# Manual only. Deploys run from a dev machine via ./deploy.sh, not from Actions.
# Never add a self-hosted runner job here: on a public repo, fork PRs could run
# arbitrary code on that runner.

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-build-test-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        # Non-blocking: pre-existing HEEx template formatting differences should
        # not gate deploys. Reports drift without failing the job.
        run: mix format --check-formatted || true

      - name: Run tests
        run: mix test

