name: CI + Deploy

# Automatic triggers disabled — no push/PR runs until self-hosted runner is set up on the Pi.
# To activate: replace workflow_dispatch with the push/pull_request block below and
# register the runner on the Pi (GitHub → Settings → Actions → Runners → New self-hosted runner).
#
# on:
#   push:
#     branches: ["**"]
#   pull_request:
#     branches: ["main"]

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-build-test-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart
        run: docker compose up --build -d --remove-orphans
