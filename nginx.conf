server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Keep any directory redirects relative (safe behind a reverse proxy).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # NOTE: nginx add_header does NOT inherit into a location that defines its
    # own add_header, so the security headers are repeated in every location.

    # Pages — clean URLs served directly (/en -> /en/index.html, no redirect).
    location / {
        try_files $uri $uri/index.html $uri/ =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HTML revalidates so content updates ship immediately.
        add_header Cache-Control "public, no-cache" always;
    }

    # Long-cache immutable assets.
    location ~* \.(svg|png|jpe?g|gif|ico|woff2?|vcf)$ {
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
