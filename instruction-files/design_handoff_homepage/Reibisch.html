<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reibisch — Tomke Reibisch · Software & Beratung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #eef2f1; font-family: 'Geist', system-ui, sans-serif; }
  /* Per-artboard language switch overlay */
  .lang-switch {
    position: fixed; top: 16px; right: 16px; z-index: 50;
    display: inline-flex; gap: 0;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
    border: 1px solid rgba(0,0,0,0.08); border-radius: 999px; overflow: hidden;
    font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
  }
  .lang-switch button {
    border: 0; background: transparent; padding: 6px 12px; cursor: pointer;
    color: rgba(28, 42, 50, 0.55); text-transform: uppercase;
  }
  .lang-switch button.on { background: #c9b87a; color: #1a2b35; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="content.jsx"></script>
<script type="text/babel" src="direction-hafen.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

// Final tweak values chosen by Tomke during design review.
const FUN_LEVEL = 75;
const LOCAL_TOUCH = 85;

function LangSwitch({ lang, setLang }) {
  return (
    <div className="lang-switch">
      <button className={lang === "de" ? "on" : ""} onClick={() => setLang("de")}>DE</button>
      <button className={lang === "en" ? "on" : ""} onClick={() => setLang("en")}>EN</button>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("de");
  return (
    <>
      <LangSwitch lang={lang} setLang={setLang} />
      <div style={{ margin: "0 auto", maxWidth: 1280 }}>
        <DirectionHafen lang={lang} fun={FUN_LEVEL} localTouch={LOCAL_TOUCH} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
