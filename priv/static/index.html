<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reibisch</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: #26465a;
      color: #eef2f1;
      font-family: 'Newsreader', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .content {
      text-align: center;
      user-select: none;
    }

    .wordmark {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 300;

      letter-spacing: 0.04em;
      color: #eef2f1;
    }

    .tagline {
      margin-top: 0.6rem;
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: #a8bfc8;
      text-transform: lowercase;
    }

    .wave {
      margin-top: 2.8rem;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="wordmark">Reibisch</div>
    <div class="tagline">coming soon</div>
    <svg class="wave" width="220" height="36" viewBox="0 0 220 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
        d="M 10 22 Q 27.5 8 45 22 T 80 22 T 115 22 T 150 22 T 185 22 T 210 22"
        stroke="#c9b87a"
        stroke-width="1.6"
        stroke-linecap="round"
        fill="none"
        opacity="0.85"
      />
    </svg>
  </div>
</body>
</html>
