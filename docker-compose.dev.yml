services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    ports:
      - "4000:4000"
    environment:
      - MIX_ENV=dev
      - SECRET_KEY_BASE=dev_secret_key_base_at_least_64_bytes_long_replace_in_prod_please
    command: sh -c "mix deps.get && mix phx.server"

volumes:
  mix_deps:
  mix_build:
